      <stop offset="0" stop-color="#08152d"/>
      <stop offset="1" stop-color="#171044"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55e6ff"/>
      <stop offset="1" stop-color="#a56cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
