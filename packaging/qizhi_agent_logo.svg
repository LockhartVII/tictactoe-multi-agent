    <path d="M160 174c18-19 49-20 67-2 18 18 18 47 0 65-18 18-49 17-67-2"/>
    <path d="M352 176c-12-12-31-13-43-1-12 12-12 31 0 43l43 43c12 12 12 31 0 43-12 12-31 11-43-1"/>
  </g>
