<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Qizhi Agent logo</title>
  <desc id="desc">A glowing nine-square board with a blue and violet QZ mark.</desc>
  <defs>
